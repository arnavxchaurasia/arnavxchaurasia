<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="60%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2b2b"/>
      <stop offset="100%" stop-color="#7a0000"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#c9c9c9"/>
      <stop offset="100%" stop-color="#8a0000"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- Sharingan -->
  <g transform="translate(150,140)">
    <circle r="82" fill="#050505" stroke="#3a0000" stroke-width="3"/>
    <circle r="70" fill="url(#eyeGlow)"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <g fill="#050505">
        <path d="M0,-40 C14,-30 14,-10 0,-6 C-6,-14 -6,-32 0,-40 Z"/>
        <circle cx="0" cy="-40" r="7"/>
      </g>
      <g fill="#050505" transform="rotate(120)">
        <path d="M0,-40 C14,-30 14,-10 0,-6 C-6,-14 -6,-32 0,-40 Z"/>
        <circle cx="0" cy="-40" r="7"/>
      </g>
      <g fill="#050505" transform="rotate(240)">
        <path d="M0,-40 C14,-30 14,-10 0,-6 C-6,-14 -6,-32 0,-40 Z"/>
        <circle cx="0" cy="-40" r="7"/>
      </g>
    </g>
    <circle r="10" fill="#050505"/>
    <circle r="82" fill="none" stroke="#ff2b2b" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="78;92;78" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Katana -->
  <g transform="translate(230,235) rotate(-28)">
    <rect x="0" y="-4" width="230" height="8" fill="url(#blade)"/>
    <rect x="225" y="-10" width="14" height="20" fill="#111"/>
    <rect x="239" y="-3" width="50" height="6" fill="#5a1a1a"/>
    <circle cx="292" cy="0" r="7" fill="#c9a227"/>
  </g>

  <!-- Name -->
  <g font-family="'Fira Code', 'Courier New', monospace" fill="#f2f2f2">
    <text x="290" y="130" font-size="52" font-weight="700" letter-spacing="2">
      ARNAV CHAURASIA
      <animate attributeName="opacity" values="0;0;1" dur="1.6s" begin="0s" fill="freeze"/>
    </text>
    <text x="292" y="168" font-size="20" fill="#e04b4b" letter-spacing="1">
      class Shinobi extends Developer { rank = "Uchiha-tier"; }
    </text>
  </g>
</svg>
